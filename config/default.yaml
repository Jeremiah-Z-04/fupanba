# ============================================================
# ThemeHunter / 复盘吧 - 默认配置
# 所有算法参数集中在此文件，改配置不改代码
# ============================================================

app:
  name: ThemeHunter
  version: 0.1.0
  # 数据目录（相对项目根目录）；分发时 data/ 与程序同级
  data_dir: data
  log_dir: data/logs

# ------------------------------------------------------------
# 数据源：按 priority 顺序尝试，失败自动降级
# ------------------------------------------------------------
datasource:
  priority: [fuyao]            # 只用同花顺官方 API（单一数据源，避免口径混乱）
  timeout_sec: 15
  retry: 2
  retry_interval_sec: 3
  fuyao:
    enabled: true
  ifind:
    enabled: false
    # iFinD 账号密码不建议写在 yaml，运行时从环境变量或首次启动输入读取
    # 环境变量名：THS_IFIND_USER / THS_IFIND_PASS
  akshare:
    enabled: false             # 关闭东财/akshare（只用同花顺，用户要求）

# ------------------------------------------------------------
# 涨停池采集口径
# ------------------------------------------------------------
zt_pool:
  exclude_st_from_ladder: true   # ST 股不计入连板梯队（仍保留在池中）
  exclude_bj: false              # 是否排除北交所（30cm 板）
  min_zt_price: 0                # 低价股过滤（元），0 = 不过滤

# ------------------------------------------------------------
# 连板口径（规则集中于 src/core/lianban.py，此处仅开关）
# ------------------------------------------------------------
lianban:
  reset_on_break: true           # 断板即清零
  st_not_counted: false          # ST 股也计入连板梯队与板块强度（用户确认 ST 参与计算）
  tag_yizi: true                 # 一字板打标（开盘价=涨停价）

# ------------------------------------------------------------
# 应用内更新（仅打包版 exe 生效）
# ------------------------------------------------------------
update:
  enabled: true
  # 更新清单地址（发布更新站点后填），如 https://xxx/update.json；留空 = 不检查更新
  manifest_url: ""
  # 题材框架同步地址。应用更新包会保留 data/，框架存在数据库里，
  # 所以新框架只能靠这条独立通道下发；留空 = 用 src/core/framework_sync.py 里的内置地址
  framework_url: ""
  # 启动时静默同步一次框架（打包给朋友时建议开；源码运行不会触发，免得冲掉本地改动）
  framework_auto_sync: true

# ------------------------------------------------------------
# 龙头排序：同板内因子权重（第一主因子恒为连板高度）
# ------------------------------------------------------------
leader:
  top_n: 3                       # 每个题材只输出前 N 个龙标
  # 排序优先级（硬排序，2026-10-29 调整）：板幅归一强度（封板恒 1.0，异动股=涨幅/板幅）
  #   > 上板时间（早上板=辨识度）> 连板高度 > 以下同档加权微调
  weights:
    fengdan_ratio: 1.0           # 封单/流通市值
    turnover:      0.5           # 合理换手（过高过低都减分，见 sweet_spot）
    float_mv:      0.5           # 流通市值（偏小优先，短线弹性）
  turnover_sweet_spot: [5, 25]   # 合理换手区间（%）
  yizi_bonus: 0.0                # 一字板加成分（0 = 不区别对待）

# ------------------------------------------------------------
# 导出
# ------------------------------------------------------------
export:
  clipboard_separator: newline   # newline / comma（同花顺自定义板块两种都认）
  dedup_global: true             # 跨题材全局去重（一股多簇只导一次）
  clipboard_chunk_size: 200      # 同花顺一次粘贴字数上限，超出自动分次复制（每代码6字+分隔符≈28只/组）
  csv_dir: data/exports
  csv_fields: [date, theme_name, code, name, leader_rank, lianban_height]

  # 导出到同花顺（txt 上传 / 图片识别），落在 data/exports/ths/<日期>/
  # 注意：按题材导出只在题材内去重，一股多簇的股票会同时出现在多个板块里
  ths:
    dir: exports/ths             # 相对 data_dir
    keep_days: 7                 # 保留最近 N 个日期目录，超出自动清理
    min_members: 2               # 「全部题材」只导 ≥2 只的题材（实测 49 个里 37 个只有 1 只）
    max_themes: 30               # 「全部题材」安全上限（最忙的一天曾 103 个题材）
    txt_chunk: 0                 # 0 = 一个题材一个 txt 不分卷（200 字是粘贴框限制，与文件上传无关）
    img_chunk: 12                # 每张图片的代码数（同花顺图片识别实测 10~20 只稳）
    img_font_px: 40              # 图内字号
    img_line_px: 56              # 行高（1.4 倍，再小容易把两行识别成一行）
    img_pad_px: 36               # 四周留白
    img_dpr: 2                   # 渲染倍率（输出约 408×1488，单张 20~40KB）

# ------------------------------------------------------------
# 聚类（MVP1 用静态概念直通，MVP2 规则版，MVP3 HDBSCAN）
# ------------------------------------------------------------
clustering:
  mode: reason                   # reason(涨停原因资金逻辑) / static_concept(静态概念直通) / hdbscan(MVP3)
  # 开盘啦题材层级表：把原因里的细分词归到官方大板块（「冰雪工程」->「体育产业」）。
  # 表由 build_kpl_framework.py 从框架文本生成，改框架重跑脚本即可。
  use_kpl_framework: true
  kpl_framework_path: config/kpl_framework.yaml
  # 允许做「包含匹配」的 2 字词白名单。2 字泛词（汽车/电子/材料）默认只认精确，
  # 否则「汽车芯片」会被「汽车」吞进汽车板块；这里放的是本身即独立主线的 2 字词。
  kpl_two_char_include:
    - 冰雪
    - 旅游
    - 光伏
    - 稀土
    - 核电
    - 军工
    - 芯片
    - 算力
    - 储能
    - 白酒
    - 黄金
    - 煤炭
    - 钢铁
    - 疫苗
    - 猪肉
    - 锂电
    - 风电
    - 氢能
    - 航运
    - 造船
    - 银行
    - 证券
    - 保险

  # 簇内涨停数 < 此值视为无效小簇；1 = 单只涨停也成板块（用户要求，对齐开盘啦）
  min_cluster_size: 1
  # 题材归并：按成员 Jaccard 重叠率合并题材。0 = 关闭。
  # 2026-10-30 关闭：接入开盘啦框架后「同主线归并」已由框架完成，
  # 而多归属（一股进多个板块）会让两个不相干板块的成员高度重叠，
  # Jaccard 虚高到 1.0，把「AI应用+华为概念+元宇宙+光伏」串成一个大杂烩。
  merge_threshold: 0.6
  # 涨停原因关键词停用词（噪音词）。主要靠 min_cluster_size 过滤低频噪音，
  # 这里放的是「不是题材」的通用标签（业绩/次新/回购这类），否则它们会单独成题。
  reason_stopwords:
    - 业绩增长
    - 半年报增长
    - 年报增长
    - 一季报增长
    - 扭亏为盈
    - 股份回购
    - 股东增持
    - 次新股
    - 高送转
    - 专精特新
    - 股权受让
    - 股权激励
    - 重大重组
    - 检验检测
  # 单股也保留的题材白名单：有辨识度、跨日持续的题材（如生肖"羊字辈"）。
  # 命中关键词（包含关系）即使 < min_cluster_size 也保留，不当作低频噪音过滤。
  keep_single:
    - 羊字辈
  # 主线归并：细分题材词命中任一关键词即归入同一主线。
  # 解决「人形机器人/机器人零部件/具身智能/物理AI」被拆成十几个小簇、
  # 每个都过不了 min_size，导致真主线消失的问题。
  theme_families:
    机器人:
      - 机器人
      - 具身智能
      - 物理AI
      - 灵巧手
      - 减速器
      - 丝杠
      - 电子皮肤
      - 六维力传感器
    # 汽车链：涨停原因常写成具体零部件（汽车轴承/汽车内饰/汽车线束…），
    # 不归并就会变成十几个只有 1 只的「汽车XX」题材。用具体词而非裸「汽车」，
    # 避免把「新能源汽车」「汽车芯片」这类别的主线也吞进来。
    汽车零部件:
      - 汽车零部件
      - 汽车制动
      - 汽车轴承
      - 汽车内饰
      - 汽车内外饰
      - 汽车减震
      - 汽车电子
      - 汽车物流
      - 汽车线束
      - 汽车车桥
      - 汽车连接器
      - 汽车热管理
      - 汽车模组
      - 整车配套
    # 消费链：零售/食品原先各自成板块，2026-10-31 起统一并到「大消费」
    大消费:
      - 百货零售
      - 商贸零售
      - 连锁零售
      - 零售促销
      - 免税退税
      - 新零售
      - 全渠道运营
      - 乳制品
      - 休闲食品
      - 饼干食品
    # 业绩线：三季报增长/预增/扭亏 是同一个炒作逻辑（业绩超预期），
    # 拆开各自成簇会只剩 1~2 只。中报/年报口径不同，不并进来。
    三季报增长:
      - 三季报增长
      - 三季报预增
      - 三季报扭亏
  # 成员制补全只认「核心概念」：主线 -> 概念名。
  # 不配则用与主线同名的概念兜底；配了白名单后，其它概念不再自动并入。
  # 用户要求放宽：机器人认「人形机器人 + 机器人概念」，对齐开盘啦板块口径。
  theme_core_concepts:
    机器人:
      - 人形机器人
      - 机器人概念
  # 概念补全的宽度上限：成分股超过该数量的概念视为宽泛标签，不参与补全。
  # 用户要求放宽：调到 1250，让「机器人概念(1229)/人工智能(1085)/新能源汽车(1067)」
  # 等题材宽概念参与补全，对齐开盘啦；「专精特新(1256)/融资融券/国企改革」仍靠
  # 黑名单 + 阈值挡掉。
  concept_max_members: 1250
  # 泛概念/宽泛标签黑名单：成分极多、不构成"日内主线题材"的概念直接跳过。
  # 这类标签会把融资融券/一带一路等误判成主线，MVP1 先黑名单压制，
  # MVP2+ 改用「题材纯度」(涨停数/成分总数) 作为因子更彻底。
  generic_concept_blacklist:
    - 融资融券
    - 沪股通
    - 深股通
    - MSCI中国
    - 富时罗素
    - 标普道琼斯
    - 一带一路
    - 央企改革
    - 国企改革
    - 央企
    - 转融券标的
    - 证金持股
    - 汇金持股
    - 破净股
    - 高股息
    - 举牌
    - 股权激励
    - 沪深300
    - 中证500
    - 上证50
    - 富时中国A50
    - 养老金
    - 社保重仓
    - 基金重仓
    - ST板块
    - 退市风险警示
    - 融资
  # 概念名 -> 主线名。板块改名/合并后，同花顺概念仍挂老名字，
  # 不接一下会独立成一个「只有 1 只」的孤儿板块（大消费合并后就冒出过「食品饮料」）。
  # 二级细分仍按框架里的细分词走，这里只决定归到哪个一级题材。
  concept_theme_alias:
    食品饮料: 大消费
    旅游: 大消费
    零售: 大消费
    免税: 大消费
    家电: 大消费
    服装家纺: 大消费

  rule:                          # MVP2 参数预留
    time_window_min: 30
    min_co_zt: 3
  hdbscan:                       # MVP3 参数预留
    min_cluster_size: 3
    weights:
      time: 1.0
      text: 1.0
      label: 1.0
