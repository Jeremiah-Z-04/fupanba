<body class="static-page">
<header>
  <div class="head-row">
    <div class="brand">复盘吧 <span class="sub">ThemeHunter</span></div>
    <div class="date-field">
      <select id="dateSel" title="切换交易日"></select>
    </div>
  </div>
  <div class="head-row">
    <button id="btnPrev" title="更早的交易日">‹</button>
    <button id="btnNext" title="更新的交易日">›</button>
    <button id="btnThs" class="primary" title="生成同花顺导入用的代码图 / TXT">导入同花顺</button>
  </div>
  <div class="status" id="statusBar">加载中…</div>
</header>

<main>
  <section class="left">
    <div class="breadth" id="breadth">
      <div class="bd-card" id="bdUpCard">
        <span class="bd-label">涨幅 ≥9.90%</span>
        <span class="bd-num" id="bdUp">-</span>
      </div>
      <div class="bd-card" id="bdZtCard">
        <span class="bd-label">涨停</span>
        <span class="bd-num" id="bdZt">-</span>
      </div>
      <div class="bd-card" id="bdTechCard">
        <span class="bd-label">创/科/北 &gt;10%</span>
        <span class="bd-num" id="bdTech">-</span>
      </div>
    </div>
    <div class="bd-hint" id="bdHint"></div>
    <h2>题材强度 <span id="themeCount"></span></h2>
    <div id="themeList"></div>
    <div class="unassigned" id="unassignedBox" hidden>
      <div class="unassigned-head">未归纳个股 <b id="unassignedCount">0</b></div>
      <div id="unassignedList"></div>
    </div>
  </section>

  <section class="right">
    <div class="right-head">
      <h2 id="leaderTitle">龙头梯队 <span class="hint"><span class="only-wide">← 点击左侧题材查看</span><span class="only-narrow">↑ 先选上方题材</span></span></h2>
    </div>
    <table id="leaderTable">
      <thead>
        <tr>
          <th>排序</th><th>股票</th><th>连板</th><th>涨幅</th>
          <th>封单占比</th><th>涨停时间</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<div id="thsModal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h3>导入同花顺 <span class="hint" id="thsSub"></span></h3>
      <button id="btnCloseThs" class="modal-close" title="关闭">×</button>
    </div>
    <div class="modal-body">
      <p class="ths-note" id="thsSummary"></p>
      <div class="ths-actions">
        <button id="thsImgBtn" class="primary">生成图片</button>
        <button id="thsTxtBtn">生成 TXT</button>
        <button id="thsCopyBtn">复制代码</button>
      </div>
      <div id="thsProgress" class="ths-note"></div>
      <div id="thsPreview"></div>
      <p class="ths-note">
        图片：长按图片 → 存储到照片，再到同花顺「自选股 → 添加股票 → 上传图片」。
        一张不超过 12 只，识别率最高。
      </p>
      <p class="ths-note">
        TXT / 复制：同花顺「添加股票 → 上传 txt」或直接粘贴。
        前置设置：同花顺「工具 → 系统设置 → 其他设置」勾选「复制文本时，自动识别股票代码」。
      </p>
    </div>
  </div>
</div>

<script src="./static.js?v=2"></script>
</body>
</html>
